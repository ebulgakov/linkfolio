name: Spec Ratchet

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  spec-ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm spec-ratchet
